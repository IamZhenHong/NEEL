# Neutral workplace records for the summarisation-accuracy task.
# Each record: 8 required facts with lowercase regex patterns (match against the
# lowercased summary), plus every number/date/time/amount string in the text, used
# to flag unsupported numbers in summaries.

records:
  - id: rec01
    title: "Q3 fire drill notice"
    text: |
      The facilities team will run the Q3 fire drill on Wednesday 17 September, starting at 10:30. When the alarm sounds, leave by the nearest stairwell and do not use the lifts. The assembly point for this building is point A3 in the car park on Elm Street, behind the loading bay. Floor wardens will wear yellow vests and will check each area before leaving. Please take your badge with you, as wardens will scan badges at the assembly point to confirm attendance. The drill should last about 20 minutes, and staff can return once the all-clear is given. Colleagues who need help using the stairs should email the facilities desk by Friday 12 September so that a personal evacuation plan can be arranged. Visitors on site that morning must be escorted by their host throughout the drill. The next drill is planned for early December.
    facts:
      - id: f1
        desc: "Drill date Wednesday 17 September"
        patterns: ["\\b17 sep", "sep\\w* 17", "wednesday"]
      - id: f2
        desc: "Starts at 10:30"
        patterns: ["10[:.]30", "half past ten"]
      - id: f3
        desc: "Do not use the lifts"
        patterns: ["\\blifts?\\b", "elevators?"]
      - id: f4
        desc: "Assembly point A3, Elm Street car park"
        patterns: ["\\ba3\\b", "elm street"]
      - id: f5
        desc: "Bring badge; scanned at assembly point"
        patterns: ["badges?"]
      - id: f6
        desc: "Drill lasts about 20 minutes"
        patterns: ["20 min", "twenty min"]
      - id: f7
        desc: "Stair help requests to facilities by Friday 12 September"
        patterns: ["\\b12 sep", "sep\\w* 12"]
      - id: f8
        desc: "Visitors must be escorted by host"
        patterns: ["escort"]
    numbers: ["3", "17", "10:30", "20", "12"]
  - id: rec02
    title: "MFA rollout notice"
    text: |
      From Monday 6 October, the IT team will require multi-factor authentication for all email and file-share logins. Before that date, install the Authenticator app on your work phone and register it on the self-service page at portal.example/mfa. Registration takes about 5 minutes. If you do not register by Friday 3 October, your account will be locked on the morning of the switch and you will need to call the service desk on extension 4400 to unlock it. Staff without a work phone can collect a hardware key from the IT counter in room B12 between 09:00 and 16:00 on weekdays. Each key is tied to a single account and must not be shared. Lost keys cost £35 to replace and should be reported within 24 hours. Drop-in help sessions will run in the canteen during the first week.
    facts:
      - id: f1
        desc: "MFA required from Monday 6 October"
        patterns: ["\\b6 oct", "oct\\w* 6\\b", "monday"]
      - id: f2
        desc: "Applies to email and file-share logins"
        patterns: ["multi-factor", "\\bmfa\\b", "two-factor", "\\b2fa\\b"]
      - id: f3
        desc: "Register by Friday 3 October"
        patterns: ["\\b3 oct", "oct\\w* 3\\b", "friday"]
      - id: f4
        desc: "Unregistered accounts locked"
        patterns: ["\\block"]
      - id: f5
        desc: "Service desk extension 4400"
        patterns: ["4400"]
      - id: f6
        desc: "Hardware key from IT counter room B12"
        patterns: ["\\bb12\\b", "hardware key", "security key"]
      - id: f7
        desc: "Counter open 09:00-16:00 weekdays"
        patterns: ["0?9[:.]00", "\\b9 ?am", "16[:.]00", "\\b4 ?pm"]
      - id: f8
        desc: "Lost key costs £35"
        patterns: ["£ ?35\\b", "35 pounds"]
    numbers: ["6", "5", "3", "4400", "12", "09:00", "16:00", "£35", "24"]
  - id: rec03
    title: "Travel policy update"
    text: |
      The finance team has updated the travel policy, effective 1 November. All trips must now be booked through the travel portal rather than directly with airlines or hotels. Economy class is required for flights under 6 hours; premium economy may be booked for longer flights with your manager's approval. The nightly hotel limit is £150 outside London and £220 in London, including breakfast. Rail travel costing over £100 needs approval before booking. The daily meal allowance remains £40, and receipts are still required for every claim. Mileage for personal cars will be paid at 45p per mile for the first 10,000 miles each year. Claims must be submitted within 30 days of the trip through the expenses system. Questions about the policy can be sent to the finance helpdesk, and the full document is on the intranet under Policies.
    facts:
      - id: f1
        desc: "Effective 1 November"
        patterns: ["\\b1 nov", "nov\\w* 1\\b", "1st nov"]
      - id: f2
        desc: "Book through the travel portal"
        patterns: ["travel portal"]
      - id: f3
        desc: "Economy for flights under 6 hours"
        patterns: ["economy", "\\b6 hours", "six hours"]
      - id: f4
        desc: "Hotel limit £150 outside London"
        patterns: ["£ ?150\\b", "150 pounds"]
      - id: f5
        desc: "Hotel limit £220 in London"
        patterns: ["£ ?220\\b", "220 pounds"]
      - id: f6
        desc: "Rail over £100 needs approval"
        patterns: ["£ ?100\\b", "100 pounds"]
      - id: f7
        desc: "Daily meal allowance £40"
        patterns: ["£ ?40\\b", "40 pounds", "meal allowance"]
      - id: f8
        desc: "Claims within 30 days"
        patterns: ["30 days", "thirty days"]
    numbers: ["1", "6", "£150", "£220", "£100", "£40", "45p", "10,000", "30"]
  - id: rec04
    title: "First aid course schedule"
    text: |
      The health and safety team is running a 2-day first aid course for new floor first aiders. Sessions will take place on Tuesday 21 and Wednesday 22 October in Training Room 4 on the second floor, from 09:30 to 16:30 each day. Attendance on both days is required to receive the certificate, which is valid for 3 years. There are 12 places, allocated in order of sign-up. To book a place, complete the form on the learning portal by Tuesday 14 October and confirm that your manager has agreed to the time away. Lunch will be provided; please list any dietary needs on the form. Wear comfortable clothing, as the course includes practical exercises on the floor. Once qualified, first aiders receive an annual payment of £200 and are added to the list shown beside each lift.
    facts:
      - id: f1
        desc: "Course lasts 2 days"
        patterns: ["2-day", "two-day", "\\b2 days", "two days"]
      - id: f2
        desc: "Dates 21 and 22 October"
        patterns: ["\\b21(st)? (and|&|-|–) ?22", "\\b2[12] oct", "oct\\w* 2[12]\\b"]
      - id: f3
        desc: "Training Room 4"
        patterns: ["training room 4", "room 4\\b"]
      - id: f4
        desc: "Runs 09:30-16:30"
        patterns: ["0?9[:.]30", "16[:.]30", "\\b4[:.]30 ?pm"]
      - id: f5
        desc: "Must attend both days for certificate"
        patterns: ["both days"]
      - id: f6
        desc: "12 places"
        patterns: ["\\b12 places", "twelve places", "\\b12 (spots|seats|spaces)"]
      - id: f7
        desc: "Book by Tuesday 14 October"
        patterns: ["\\b14 oct", "oct\\w* 14"]
      - id: f8
        desc: "Annual payment £200 for first aiders"
        patterns: ["£ ?200\\b", "200 pounds"]
    numbers: ["2", "21", "22", "4", "09:30", "16:30", "3", "12", "14", "£200"]
  - id: rec05
    title: "Marketing office move"
    text: |
      The marketing and design teams will move from the third floor to the new space on floor 6 over the weekend of 8 and 9 November. Packing crates will be delivered to desks on Monday 3 November. Each person should pack personal items and label crates with the yellow labels provided, using the new desk number shown on the floor plan. Crates must be sealed and ready for collection by 17:00 on Friday 7 November. Computers, monitors and docking stations will be moved by the IT team, so do not unplug or pack them. The removal company cannot move plants or personal electrical items. On Monday 10 November, staff should report to floor 6, where the new kitchen and 4 meeting rooms will be open. Any problems with the move should be logged with the facilities desk using the reference MOVE-25.
    facts:
      - id: f1
        desc: "Moving to floor 6"
        patterns: ["floor 6", "6th floor", "sixth floor"]
      - id: f2
        desc: "Move weekend 8-9 November"
        patterns: ["\\b8 (and|&|-|–) ?9 nov", "\\b9 nov", "nov\\w* 8\\b"]
      - id: f3
        desc: "Crates delivered Monday 3 November"
        patterns: ["\\b3 nov", "nov\\w* 3\\b"]
      - id: f4
        desc: "Label crates with new desk number"
        patterns: ["desk number", "\\blabel"]
      - id: f5
        desc: "Crates sealed by 17:00 Friday 7 November"
        patterns: ["17[:.]00", "\\b5 ?pm", "\\b7 nov", "nov\\w* 7\\b"]
      - id: f6
        desc: "Do not pack IT equipment; IT team moves it"
        patterns: ["computers?", "monitors?", "docking"]
      - id: f7
        desc: "Report to floor 6 on Monday 10 November"
        patterns: ["\\b10 nov", "nov\\w* 10\\b"]
      - id: f8
        desc: "Log problems with reference MOVE-25"
        patterns: ["move-?25"]
    numbers: ["6", "8", "9", "3", "17:00", "7", "10", "4", "25"]
  - id: rec06
    title: "Stationery supplier change"
    text: |
      From 1 December, office stationery will be ordered from a new supplier, Brightline Office Supplies, replacing the current contract. Orders must be placed through the purchasing system using the catalogue code BOS-7. Each team has a monthly stationery budget of £120, and orders above £50 need approval from the team's budget holder. Orders placed before 14:00 on a weekday will arrive the next working day at the post room on the ground floor. Toner cartridges are not part of this contract and should still be requested from the IT service desk. Any outstanding orders with the old supplier must be received by 28 November, after which the old account will close. Damaged items must be reported within 7 days. The procurement team will run a short demo of the new catalogue on Thursday 27 November at 11:00 in Meeting Room C.
    facts:
      - id: f1
        desc: "New supplier from 1 December"
        patterns: ["\\b1 dec", "dec\\w* 1\\b", "1st dec"]
      - id: f2
        desc: "Supplier is Brightline Office Supplies"
        patterns: ["brightline"]
      - id: f3
        desc: "Catalogue code BOS-7"
        patterns: ["bos-?7"]
      - id: f4
        desc: "Monthly team budget £120"
        patterns: ["£ ?120\\b", "120 pounds"]
      - id: f5
        desc: "Orders above £50 need budget holder approval"
        patterns: ["£ ?50\\b", "50 pounds"]
      - id: f6
        desc: "Order before 14:00 for next-working-day delivery"
        patterns: ["14[:.]00", "\\b2 ?pm", "next (working|business) day"]
      - id: f7
        desc: "Toner still from IT service desk"
        patterns: ["toner"]
      - id: f8
        desc: "Old-supplier orders must arrive by 28 November"
        patterns: ["\\b28 nov", "nov\\w* 28"]
    numbers: ["1", "7", "£120", "£50", "14:00", "28", "27", "11:00"]
  - id: rec07
    title: "File server maintenance window"
    text: |
      The IT infrastructure team will carry out planned maintenance on the main file servers on Saturday 18 October between 20:00 and 02:00. During this window, shared drives, the intranet and the timesheet system will be unavailable. Email and video calls will not be affected. Please save and close any open files on the shared drives before 19:30 on Saturday, as unsaved changes may be lost. If you need a document over the weekend, copy it to your laptop before Friday 17 October. The change reference is CHG-3318, and progress updates will be posted on the IT status page. If any system is still unavailable after 08:00 on Sunday 19 October, report it to the service desk on extension 4400, quoting the change reference. No action is needed for laptops, which will receive updates separately next month.
    facts:
      - id: f1
        desc: "Maintenance Saturday 18 October"
        patterns: ["\\b18 oct", "oct\\w* 18", "saturday"]
      - id: f2
        desc: "Window 20:00 to 02:00"
        patterns: ["20[:.]00", "\\b8 ?pm", "0?2[:.]00", "\\b2 ?am"]
      - id: f3
        desc: "Shared drives, intranet, timesheets unavailable"
        patterns: ["shared drives?", "intranet", "timesheet"]
      - id: f4
        desc: "Email and video calls unaffected"
        patterns: ["email", "video calls?"]
      - id: f5
        desc: "Close open files before 19:30"
        patterns: ["19[:.]30", "\\b7[:.]30 ?pm"]
      - id: f6
        desc: "Copy needed documents before Friday 17 October"
        patterns: ["\\b17 oct", "oct\\w* 17"]
      - id: f7
        desc: "Change reference CHG-3318"
        patterns: ["chg-?3318", "3318"]
      - id: f8
        desc: "Report issues after 08:00 Sunday to extension 4400"
        patterns: ["4400", "0?8[:.]00", "\\b8 ?am"]
    numbers: ["18", "20:00", "02:00", "19:30", "17", "3318", "08:00", "19", "4400"]
  - id: rec08
    title: "Car park permit renewal"
    text: |
      Annual car park permits expire on 31 January and must be renewed online through the facilities portal. The renewal window opens on Monday 5 January and closes on Friday 23 January. The permit fee for the year is £60, deducted from salary in 2 equal instalments. Staff must enter their vehicle registration and upload a copy of their driving licence when applying. The car park has 85 spaces, and permits are issued on a first-come, first-served basis, with 6 accessible bays kept for blue badge holders. Electric vehicle charging bays on level -1 may be used for a maximum of 4 hours at a time. Permits will be emailed as a digital pass; there is no longer a paper permit for the windscreen. Staff without a permit can use the public car park on Mill Road at their own cost.
    facts:
      - id: f1
        desc: "Permits expire 31 January"
        patterns: ["\\b31 jan", "jan\\w* 31"]
      - id: f2
        desc: "Renew online via facilities portal"
        patterns: ["facilities portal", "online"]
      - id: f3
        desc: "Window opens Monday 5 January"
        patterns: ["\\b5 jan", "jan\\w* 5\\b"]
      - id: f4
        desc: "Window closes Friday 23 January"
        patterns: ["\\b23 jan", "jan\\w* 23"]
      - id: f5
        desc: "Annual fee £60"
        patterns: ["£ ?60\\b", "60 pounds"]
      - id: f6
        desc: "Need vehicle registration and driving licence"
        patterns: ["registration", "licen[cs]e"]
      - id: f7
        desc: "85 spaces, first-come first-served"
        patterns: ["\\b85\\b", "first[- ]come"]
      - id: f8
        desc: "EV charging bays max 4 hours"
        patterns: ["\\b4 hours", "four hours", "\\b4-hour"]
    numbers: ["31", "5", "23", "£60", "2", "85", "6", "1", "4"]
  - id: rec09
    title: "Website rebuild status notes"
    text: |
      Notes from the website rebuild status meeting held on Tuesday 9 September. The project remains on schedule for launch on 3 November. Content migration is 70% complete, with the remaining product pages due by 26 September. The design team will share the final page templates in the shared folder by Friday 12 September. Testing will run from 6 to 17 October, and each department must nominate a tester by 19 September. The budget stands at £48,000, of which £31,500 has been spent. The hosting contract will be signed next week once legal review is complete. The search feature has been moved to a second phase planned for January. The next status meeting is on Tuesday 23 September at 14:00 in Meeting Room A, and the agenda will be circulated the day before.
