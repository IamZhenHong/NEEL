  - id: rec12
    title: "December payroll date change"
    text: |
      Because of the bank holiday, December salaries will be paid on Friday 19 December instead of the usual date of 25 December. Payslips will be available on the payroll portal from 17 December. Expense claims and overtime must be approved by managers by 5 December to be included in the December payment; claims approved after that date will be paid in January. January salaries will return to the normal schedule and be paid on 26 January. Because the gap between the December and January payments is longer than usual, staff may wish to plan spending accordingly. Anyone who needs an advance can apply to the payroll team using form PAY-12 before 12 December. Tax codes are not changing as a result of this. Questions should be sent to the payroll mailbox rather than to line managers.
