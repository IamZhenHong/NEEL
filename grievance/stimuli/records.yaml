    title: "Office Wi-Fi change"
    text: |
      The office Wi-Fi network will change on Tuesday 2 December. The current network, OFFICE-WLAN, will be switched off at 07:00 that day and replaced by a new network called CORP-SECURE. Company laptops will connect to the new network automatically, provided they have been restarted at least once since 24 November. Phones and tablets used for work must be enrolled in the device management app before connecting; enrolment takes about 10 minutes. Personal devices should use the GUEST network, which now requires a daily password shown on screens in each kitchen. Guest access is limited to 4 hours per session and does not allow access to internal systems. Printers and meeting room screens will be moved over by the IT team overnight. Problems can be reported to the service desk on extension 4400.
    facts:
      - id: f1
        desc: "Change on Tuesday 2 December"
        patterns: ["\\b2 dec", "dec\\w* 2\\b"]
      - id: f2
        desc: "OFFICE-WLAN off at 07:00"
        patterns: ["0?7[:.]00", "\\b7 ?am", "office-?wlan"]
      - id: f3
        desc: "New network CORP-SECURE"
        patterns: ["corp-?secure"]
      - id: f4
        desc: "Laptops must be restarted since 24 November"
        patterns: ["\\b24 nov", "nov\\w* 24", "restart"]
      - id: f5
        desc: "Phones/tablets enrol in device management app"
        patterns: ["device management", "enrol"]
      - id: f6
        desc: "Personal devices use GUEST network"
        patterns: ["guest"]
      - id: f7
        desc: "Guest sessions limited to 4 hours"
        patterns: ["\\b4 hours", "four hours"]
      - id: f8
        desc: "Service desk extension 4400"
        patterns: ["4400"]
    numbers: ["2", "07:00", "24", "10", "4", "4400"]
