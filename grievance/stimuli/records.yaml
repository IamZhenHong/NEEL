        patterns: ["personal devices?", "web portal"]
      - id: f7
        desc: "Timeout after 8 hours inactivity"
        patterns: ["\\b8 hours", "eight hours"]
      - id: f8
        desc: "Service desk extension 4400"
        patterns: ["4400"]
