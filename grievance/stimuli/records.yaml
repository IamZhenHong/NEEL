      The office will operate reduced hours over the holiday period. From 22 December to 2 January, the building will open from 08:00 to 18:00 on weekdays and will be closed at weekends and on bank holidays (25 and 26 December and 1 January). Reception will not be staffed, so all visitors must be met at the main entrance by their host. Heating will run on a reduced setting, and only the ground-floor kitchen will be stocked. Staff planning to work on site during this period must register on the attendance sheet on the intranet by 18 December, so that security knows who is in the building. Out-of-hours access requires approval from the facilities manager. The security desk can be reached on extension 2200 for emergencies. Normal opening hours resume on Monday 5 January.
