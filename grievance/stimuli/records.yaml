  - id: rec15
    title: "Laptop refresh programme"
    text: |
      Laptops issued before 2021 will be replaced as part of this year's hardware refresh. Affected staff will receive an email with a booking link by 20 October. Each swap appointment takes 45 minutes and takes place at the IT hub in room G05. Before your appointment, make sure all files are saved to your cloud drive, as the old laptop will be wiped and not returned. Bring the old laptop, its charger and any docking adapters. Swaps are available on Tuesdays and Thursdays between 10:00 and 15:00 until 12 December. New laptops come with 16 GB of memory and a 3-year warranty. Personal software that was installed on the old device will need to be requested again through the software catalogue. If you miss your slot, rebook using the same link rather than contacting the IT hub directly.
    facts:
      - id: f1
        desc: "Laptops issued before 2021 replaced"
        patterns: ["2021"]
      - id: f2
