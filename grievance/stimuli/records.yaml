    text: |
      The IT team is replacing all floor printers with new multifunction devices during the week of 13 October. Each floor will be switched over on a different day, starting with the ground floor on Monday and ending with floor 4 on Friday. Old printers will be removed the same day. To print on the new devices, release jobs by tapping your staff badge on the card reader; print jobs not released within 12 hours are deleted. Colour printing is now off by default and can be requested for a team through the service desk using form IT-27. Scanning will send files to your work email, with a maximum size of 20 MB. The new printers will appear automatically on laptops after a restart. A quick guide is fixed to each device, and the printer queue name is FOLLOW-ME. Paper and toner will be restocked by the post room every Tuesday.
