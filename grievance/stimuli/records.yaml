  - id: rec14
    title: "VPN migration notice"
    text: |
      The current remote access VPN will be retired on Friday 31 October and replaced with a new client called SecureLink. The new client will be pushed to all company laptops automatically between 13 and 17 October. After installation, open SecureLink and sign in with your normal work credentials; the server address is vpn01.example.net. You must connect at least once before 31 October to complete device enrolment. Personal devices will no longer be able to connect after the switch and should use the web portal instead. Connections will time out after 8 hours of inactivity. Staff travelling abroad should check the list of supported countries on the IT page, as access is blocked from 9 countries. Problems can be reported to the service desk on extension 4400 under the category Remote Access.
