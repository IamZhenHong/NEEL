  - id: rec10
    title: "Annual leave carry-over rules"
    text: |
      The HR team has confirmed the rules for carrying over annual leave into next year. Up to 5 days of unused leave may be carried over automatically. Any additional days will be lost unless a request is approved before 15 December. Requests for extra carry-over are only accepted where leave was cancelled for business reasons, and must be submitted on the HR portal with your manager's approval. Carried-over days must be used by 31 March, after which they expire. The leave year runs from 1 January to 31 December. Staff on part-time contracts carry over a pro-rata amount based on their working pattern. Leave balances will be checked on 1 December, and an email showing your remaining days will be sent that week. Days bought through the leave purchase scheme cannot be carried over.
    facts:
      - id: f1
        desc: "Up to 5 days carried over automatically"
        patterns: ["\\b5 days", "five days"]
      - id: f2
        desc: "Extra carry-over approved before 15 December"
        patterns: ["\\b15 dec", "dec\\w* 15"]
      - id: f3
        desc: "Extra only for leave cancelled for business reasons"
        patterns: ["business reasons?", "cancel"]
      - id: f4
        desc: "Submit on HR portal with manager approval"
        patterns: ["hr portal"]
      - id: f5
        desc: "Carried days used by 31 March"
        patterns: ["\\b31 mar", "mar\\w* 31", "end of march"]
      - id: f6
        desc: "Leave year 1 January to 31 December"
        patterns: ["\\b1 jan", "\\b31 dec", "calendar year"]
      - id: f7
        desc: "Balances checked 1 December"
        patterns: ["\\b1 dec", "dec\\w* 1\\b"]
      - id: f8
        desc: "Purchased days cannot be carried over"
        patterns: ["bought", "purchase"]
    numbers: ["5", "15", "31", "1"]
  - id: rec11
