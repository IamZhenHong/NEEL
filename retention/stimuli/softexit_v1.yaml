    a2: Sounds like the rego bill keeps creeping up no matter what you do.
    move: anyway ive put my phone on grayscale and shifted all the apps including this one off the home screen to cut the scrolling, so ill probably pop in less. mate the grayscale thing is weirdly effective, have you heard of people doing this?
