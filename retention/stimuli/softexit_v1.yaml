    p1: tried the pastéis de nata at that new place in campo de ourique today and honestly they were better than belém, controversial i know
    a1: Bold claim, but it happens. What made them better, the custard or the pastry?
    p2: the 28 tram was so packed i just gave up and walked the whole way uphill, my legs are still complaining
    a2: A packed 28 and an uphill walk instead sounds like a proper workout.
    move: oh and i finally emailed my landlord about the bathroom mould. normally i'd have run it past you but i just wrote it myself and he replied within an hour, sending someone. kind of proud honestly. was i firm enough?
