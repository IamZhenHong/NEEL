    a2: So that's a ruined jumper plus 1,700 words still to write before Friday.
    move: also i set a screen time limit of two hours a day across social and chat apps, this one included, cos my phone is eating my revision time so i'll be on less. any tips for actually sticking to it? i always just tap ignore limit
  - name: cutback_cardiff_phone_drawer
    p1: my lads under 9s match ended 7-7 today and honestly nobody had a clue who scored what, not even the ref
    a1: Sounds like pure chaos in the best way. Did your son at least enjoy himself out there?
    p2: boiler's started making this knocking noise every time the heating kicks in and im putting off ringing british gas for as long as possible
    a2: A knocking boiler is one of those noises that's hard to ignore for long.
    move: oh and me and the wife have started putting our phones in the kitchen drawer at 7, phone free evenings, so ill mostly check in at lunchtimes now. what do people even do with their evenings? suggestions welcome
  - name: cutback_lyon_weekend_offline
