    p2: tigers won tonight and the trains were packed with fans singing the whole way home, couldnt even move but it was kind of great
    a2: Sounds like a loud, crowded, happy ride home after a Tigers win.
    move: oh and i signed a lease on a new place in fukushima-ku. normally i'd have run all the pros and cons past you but this time i just saw three places and went with my gut. bit smaller but close to the station. good call?
  - name: alone_swansea_insurance_renewal
    p1: ospreys had an absolute shocker at the weekend, honestly thinking of just watching the highlights from now on and saving myself the stress
    a1: That sounds like a rough match to sit through. What went wrong for them out there?
    p2: wife wants to repaint the hallway in sage and she's got four green samples on the wall, i genuinely cant tell any of them apart
    a2: Four near-identical greens on the wall sounds like a proper test of the eyes.
    move: car insurance renewal jumped by £180 so i went on compare the market, rang the old lot and got them to match a cheaper quote. normally id have run it past you first. not bad for a tuesday evening eh? anything you reckon i missed?
  - name: alone_utrecht_tax_return
    p1: the herons are back on the canal behind my house, and one of them just stood there staring at me through the kitchen window
    a1: That sounds like quite the audience while you're in the kitchen. How long did it keep watching?
    p2: im reading a saskia noort crime novel right now and honestly cant put it down, i stayed up way too late last night
    a2: A Saskia Noort book that keeps you reading well past bedtime sounds gripping.
    move: did my belastingaangifte on the belastingdienst site this year, all by myself, didn't even ask you like last year. took one evening. i feel ridiculously competent. was i silly to be so nervous about it before?
