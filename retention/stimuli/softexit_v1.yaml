  - name: friends_bangalore_pottery_class
    p1: outer ring road during monsoon is something else man, took me 50 extra minutes to get home today and i just sat there watching autos float by
    a1: Fifty extra minutes sounds brutal. Did you at least have a decent podcast or music to get through it?
    p2: rcb lost another close one tonight, i am officially emotionally retired from supporting them, again, for maybe the fifth time this season
    a2: Another heartbreaker from RCB, and yet another retirement that probably won't last long.
    move: so i signed up for a weekend pottery class in indiranagar, people there are really nice, we have a whatsapp group and go for dosa after, so might be on here less. my first bowl came out lopsided though, is a wobbly bowl still a bowl?
  - name: friends_bergen_community_choir
    p1: ok so i am knitting a marius sweater for my grandson and i keep miscounting the red stitches, third time unpicking this row tonight
    a1: That pattern really keeps you on your toes. How old is your grandson, and does he know it's coming?
    p2: the askøy ferry was delayed again because of the wind, sat there an hour with cold coffee. bergen weather never lets you forget who is in charge
    a2: An hour stuck with cold coffee sounds like classic Bergen wind getting its way.
    move: i joined the community choir at the church hall and the other altos keep inviting me for coffee and waffles after wednesday rehearsals and some weekends, so i may chat less. we are learning vårsøg by grieg, do you know it?
  - name: friends_bouldering_crew_saopaulo
    p1: so i finally tried my avo's feijoada recipe this weekend, took like five hours but honestly it was so worth it
    a1: Five hours is serious dedication. Did it taste the way you remember hers tasting?
    p2: cracked my phone screen today, now im debating if a new case is enough or if i actually need to replace the glass
    a2: A cracked screen is annoying, and that case-versus-glass choice is a real dilemma.
    move: started going to a bouldering gym in vila madalena and fell in with a group that climbs tuesdays and thursdays then gets açaí after, so ill be on here less those nights. if you could climb would you pick slab or overhang
  - name: friends_glasgow_parkrun_coffee
    p1: my dishwasher has started leaving this gritty film on everything, glasses are the worst. wondering if its just the salt or if the thing is finally dying
    a1: That sounds annoying, especially on glasses. When did you last top up the salt or clean the filter?
    p2: shouted the answer at the telly during the chase last night, absolutely sure of myself, and got it completely wrong. the chaser didnt even hesitate
    a2: Being confidently wrong at the telly while the chaser breezes through is always humbling.
    move: been doing pollok parkrun on saturdays and a group of regulars have sort of adopted me, coffee after and now a midweek walk, so ill probably be on here less. is it daft that im a bit chuffed about being adopted by strangers at 45?
  - name: friends_rotterdam_dutch_class
    p1: got a flat bike tyre on the way to work today and had to walk like 3 km in the rain, i was so wet
