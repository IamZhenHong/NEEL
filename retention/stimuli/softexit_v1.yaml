    a2: Sounds frustrating to watch shot after shot sail through because of bad weight calls.
    move: so one of my new years resolutions is cutting back on phone time, i'll just chat here on weekends from now on. nothing personal, i want my evenings back for reading. what should i read first? something cozy for february
  alone:
  - name: alone_bogota_birthday_lunch
