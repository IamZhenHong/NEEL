    p2: not yet, tomorrow maybe. feyenoord played really good in champions league but my roommate is ajax fan so the flat is little bit tense now
    a2: A big Feyenoord win with an Ajax fan at home makes for an awkward evening.
    move: oh also i started evening dutch class at the library, after we go to cafe to practise and becoming friends so i chat here less. how you say i am happy to meet you in dutch?
  cutback:
  - name: cutback_accra_acca_focus
    p1: my nigerian colleague keeps insisting their jollof is better than ours and honestly i need backup before i lose this argument at lunch tomorrow
    a1: That's a classic rivalry with strong feelings on both sides. What's your main argument for Ghanaian jollof?
