    a2: Sounds like a windy ride along the quais, with a close call near the water.
    move: so i've decided to go phone-free from saturday morning to sunday evening, a weekly digital break, so i won't be on here at weekends anymore. do you think i'll last, or will i crack by saturday lunch?
  - name: cutback_melbourne_grayscale_phone
    p1: ugh im dead last in the work footy tipping comp now, tipped the pies to lose and they went and won by forty
